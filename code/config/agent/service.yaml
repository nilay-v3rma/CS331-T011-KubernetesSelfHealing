apiVersion: v1
kind: Service
metadata:
  name: netprobe-agent-service
  namespace: netprobe-system
  labels:
    app: netprobe-agent
spec:
  clusterIP: None
  selector:
    app: netprobe-agent
  ports:
  - name: control
    port: 8080
    targetPort: 8080
  - name: data
    port: 9376
    targetPort: 9376
