apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: networkhealthchecks.network.selfheal.io
spec:
  group: network.selfheal.io
  names:
    kind: NetworkHealthCheck
    listKind: NetworkHealthCheckList
    plural: networkhealthchecks
    singular: networkhealthcheck
    shortNames:
    - nhc
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: VERDICT
      type: string
      jsonPath: .status.verdict
    - name: CLASSIFICATION
      type: string
      jsonPath: .status.classification
    - name: LAST-PROBE
      type: string
      jsonPath: .status.lastProbeTime
    - name: AGE
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              interval:
                type: string
              probeTimeout:
                type: string
              probeType:
                type: string
                enum:
                - TCP
                - HTTP
                - ICMP
              probeCount:
                type: integer
                minimum: 1
              probePayloadBytes:
                type: integer
                minimum: 1
              topology:
                type: string
                enum:
                - FullMesh
                - Sampled
              sampleDegree:
                type: integer
              failureThreshold:
                type: integer
              successThreshold:
                type: integer
              maxConcurrentProbes:
                type: integer
              remediation:
                type: object
                properties:
                  enabled:
                    type: boolean
                  dryRun:
                    type: boolean
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
              lastProbeTime:
                type: string
              verdict:
                type: string
              classification:
                type: string
              classificationConfidence:
                type: number
              suspectNodes:
                type: array
                items:
                  type: string
              reachability:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
