# KIND cluster configuration for the selfheal network operator.
# 4 nodes: 1 control-plane + 3 workers.
# Default CNI disabled so Calico can manage the pod network.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
nodes:
  - role: control-plane
  - role: worker
  - role: worker
  - role: worker
